[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.2.2.post1"
description = "Towards GPT-4 like large language and visual assistant."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # B200/Blackwell needs a recent CUDA build. These public pins also accept
    # already-installed local CUDA wheels such as torch==2.7.1+cu128.
    "torch==2.7.1", "torchvision==0.22.1", "torchaudio==2.7.1",
    "transformers==4.37.2", "tokenizers==0.15.1", "sentencepiece==0.1.99", "shortuuid",
    "accelerate==0.21.0", "peft==0.4.0", "bitsandbytes==0.45.5",
    "pydantic==2.12.5", "markdown2[all]==2.5.5", "numpy==1.26.4", "scikit-learn==1.2.2",
    "gradio==4.16.0", "gradio_client==0.8.1",
    "requests==2.33.1", "httpx==0.24.0", "uvicorn==0.44.0", "fastapi==0.135.3",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13",
    "triton==3.3.1",
]

[project.optional-dependencies]
train = ["deepspeed==0.18.9", "ninja==1.13.0", "wandb==0.25.1"]
build = ["build", "twine"]

[project.urls]
"Homepage" = "https://llava-vl.github.io"
"Bug Tracker" = "https://github.com/haotian-liu/LLaVA/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
